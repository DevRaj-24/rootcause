name: Finalize RootCause Submission
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-tag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build artifacts
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-pptx python-docx pillow
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python scripts/build_submission.py
      - name: Commit generated artifacts
        run: |
          git config user.name "rootcause team"
          git config user.email "rootcause@users.noreply.github.com"
          git add submission
          if git diff --cached --quiet; then echo "No generated changes"; else git commit -m "Add final submission artifacts"; git push origin main; fi
      - name: Create final tag and release
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          TAG="PRISM_GENAI_HACKATHON_Y2026"
          git fetch --tags origin
          git tag -f "$TAG" HEAD
          git push -f origin "$TAG"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "PRISM GenAI Hackathon 2026 Final" --notes "RootCause — Smart Guided Troubleshooting Engine final judging snapshot."
